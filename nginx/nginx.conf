server {
    listen 80 default_server;
    server_name _;

    # Hide NGINX version string for security
    server_tokens off;

    # Maximum allowed request body size (for avatars, media uploads)
    client_max_body_size 50M;

    # Timeout settings to prevent slowloris attacks
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 15s;

    # Static files served directly by NGINX
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # Media uploads served directly by NGINX with fallback to Django for double-encoded URLs
    location /media/ {
        root /app;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        try_files $uri @django_backend;
    }

    # Proxy all API and web traffic to Gunicorn
    location / {
        try_files $uri @django_backend;
    }

    location @django_backend {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Protect against slow/stalled upstream connections
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
